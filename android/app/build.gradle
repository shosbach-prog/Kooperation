plugins { id 'com.android.application' }

def appUrl = project.findProperty('appUrl') ?: 'https://roboticstarter.de/lwl/'
// Version kann beim automatischen Bau vorgegeben werden (GitHub Actions: -PversionCode=… -PversionName=…)
def vCode = (project.findProperty('versionCode') ?: '3') as Integer
def vName = project.findProperty('versionName') ?: '1.2'
def appHost = new URI(appUrl).host
def appPath = new URI(appUrl).path ?: '/'

android {
    namespace 'de.roboticstarter.dienstplan'
    compileSdk 35
    defaultConfig {
        applicationId 'de.roboticstarter.dienstplan'
        minSdk 21
        targetSdk 35
        versionCode vCode
        versionName vName
        manifestPlaceholders = [hostName: appHost, pathPrefix: appPath, launchUrl: appUrl]
        resValue 'string', 'launchUrl', "${appUrl}?app=${vCode}"
        resValue 'string', 'assetStatements', """[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "web", "site": "https://${appHost}" } }]"""
    }
    signingConfigs {
        release {
            // Signaturschlüssel liegt NICHT im Repository (siehe android/README.md)
            def ks = System.getenv('DIENSTPLAN_KEYSTORE') ?: "${rootDir}/signing/dienstplan.jks"
            storeFile file(ks)
            storePassword System.getenv('DIENSTPLAN_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'dienstplan'
            keyPassword System.getenv('DIENSTPLAN_KEYSTORE_PASSWORD') ?: ''
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
